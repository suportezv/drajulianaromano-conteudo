<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,700&family=Montserrat:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #F6F1E6; font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; }
    a { color: #C9AA6E; } a:hover { color: #A6874B; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; background: linear-gradient(115deg, #F6F1E6 0%, #F6F1E6 55%, #EBDFC6 100%); box-sizing: border-box; display: flex; overflow: hidden; position: relative">
  <img src="monograma.png" alt="" style="position: absolute; right: -110px; bottom: -150px; width: 540px; height: auto; opacity: 0.14">
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 24px; padding: 64px 8px 64px 72px; max-width: 720px; position: relative">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 44px; height: 3px; background: {{destaque}}"></div>
      <div style="font-size: 18px; letter-spacing: 0.32em; text-transform: uppercase; color: #2B3A5E; font-weight: 700">Razões da obesidade</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-weight: 800; font-size: 70px; line-height: 1.05; text-transform: uppercase; color: #2B3A5E">Voltou a</div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-style: italic; font-size: 126px; line-height: 1; text-transform: uppercase; color: {{destaque}}">Engordar?</div>
    </div>
    <div style="background: #2B3A5E; border-radius: 4px; padding: 18px 26px; max-width: 560px">
      <div style="font-size: 29px; line-height: 1.35; color: #F6F1E6; font-weight: 500">Talvez o problema <span style="color: #C9AA6E; font-weight: 700">não seja a comida</span></div>
    </div>
    <img src="logo-claro.png" alt="Dra. Juliana Romano" style="width: 250px; height: auto; margin-top: 10px">
  </div>
  <div style="position: absolute; right: 24px; bottom: 0; display: flex; align-items: flex-end">
    <img src="foto-dra-ju.webp" alt="Dra. Juliana Romano" style="height: 680px; width: auto">
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"destaque":{"editor":"color","default":"#7A96B8","options":["#7A96B8","#C9AA6E","#2B3A5E"],"section":"Marca"}}'>
class Component extends DCLogic {
  renderVals() {
    return { destaque: this.props.destaque ?? '#7A96B8' };
  }
}
</script>
</body>
</html>
