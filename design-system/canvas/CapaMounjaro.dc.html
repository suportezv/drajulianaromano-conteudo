<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Montserrat:wght@500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #2B3A5E; font-family: 'Montserrat', 'Segoe UI', system-ui, sans-serif; }
    a { color: #C9AA6E; } a:hover { color: #A6874B; }
  </style>
</helmet>
<div style="width: 1280px; height: 720px; background: linear-gradient(115deg, #1F2B47 0%, #2B3A5E 58%, #3A4E77 100%); box-sizing: border-box; display: flex; overflow: hidden; position: relative">
  <img src="monograma.png" alt="" style="position: absolute; right: -120px; top: -140px; width: 560px; height: auto; opacity: 0.12">
  <div style="display: flex; flex-direction: column; justify-content: center; gap: 26px; padding: 64px 8px 64px 72px; max-width: 730px; position: relative">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 44px; height: 3px; background: {{destaque}}"></div>
      <div style="font-size: 19px; letter-spacing: 0.34em; text-transform: uppercase; color: {{destaque}}; font-weight: 700">Atenção</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <div style="font-weight: 800; font-size: 54px; line-height: 1.08; text-transform: uppercase; color: #F6F1E6">Esse erro no uso do</div>
      <div style="font-family: 'Playfair Display', Georgia, serif; font-weight: 800; font-size: 122px; line-height: 1; text-transform: uppercase; color: {{destaque}}">Mounjaro</div>
      <div style="font-weight: 800; font-size: 54px; line-height: 1.08; text-transform: uppercase; color: #F6F1E6">pode te custar <span style="color: #E6CFA9">caro</span></div>
    </div>
    <img src="logo-escuro.png" alt="Dra. Juliana Romano" style="width: 250px; height: auto; margin-top: 12px">
  </div>
  <div style="position: absolute; right: 16px; bottom: 0; display: flex; align-items: flex-end">
    <img src="foto-dra-ju.webp" alt="Dra. Juliana Romano" style="height: 680px; width: auto">
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"destaque":{"editor":"color","default":"#C9AA6E","options":["#C9AA6E","#7A96B8","#E6CFA9"],"section":"Marca"}}'>
class Component extends DCLogic {
  renderVals() {
    return { destaque: this.props.destaque ?? '#C9AA6E' };
  }
}
</script>
</body>
</html>
